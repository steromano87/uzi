# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: uzi

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - go vet ./...
    - go test ./...

builds:
  - id: static
    main: ./cmd/uzi
    binary: uzi

    env:
      - CGO_ENABLED=0
    tags:
      - netgo
      - osgo
      - sqlite_omit_load_extension
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/steromano87/uzi/v1/pkg/version.Version={{ .Version }}
      - -X github.com/steromano87/uzi/v1/pkg/version.Commit={{ .Commit }}
      - -X github.com/steromano87/uzi/v1/pkg/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats:
      - tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

report_sizes: true

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
