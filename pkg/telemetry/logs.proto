syntax = "proto3";
package telemetry;
option go_package = "github.com/steromano87/harkonnen/v1/pkg/telemetry";

import "google/protobuf/empty.proto";

service Logs {
  rpc GetRawLogs(LogEntriesStreamRequest) returns (stream RawLog) {}
}

//////////////////////////////////////////

message LogEntriesStreamRequest {
  google.protobuf.Empty _ = 1;
}

message RawLog {
  bytes entry = 1;
}
