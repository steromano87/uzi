syntax = "proto3";
package telemetry;
option go_package = "github.com/steromano87/uzi/v1/pkg/telemetry";

import "google/protobuf/empty.proto";

service Logs {
  rpc GetRawLogs(RawLogsStreamRequest) returns (stream RawLog) {}
}

//////////////////////////////////////////

message RawLogsStreamRequest {
  google.protobuf.Empty _ = 1;
}

message RawLog {
  string content = 1;
}
