syntax = "proto3";
package telemetry;
option go_package = "github.com/steromano87/harkonnen/v1/pkg/telemetry";

service Log {
  rpc Save(stream RawLog) returns (LogSaveResponse) {}
}

//////////////////////////////////////////

message RawLog {
  string host_id = 1;
  bytes entry = 2;
}

message LogSaveResponse {
  uint64 saved_logs = 1;
}