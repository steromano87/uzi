name: My loading project with Harkonnen

harkonnenVersion: "all"

#################
# Configuration #
#################

load:
  script: "my_script.hcl"
  maxIterations: 0
  profile:
    kind: LinearRamp
    spec:
      maxUsers: 5
      initialDelay: 0s
      rampUp: 10s
      sustain: 5m
      rampDown: 5s

injector:
  kind: local
  spec:
    startTimeout: 15s
    shutdownTimeout: 2m
    startupStatusPollInterval: 500ms

logging:
  level: info

controller:
  shutdownTimeout: 30s
  scheduler:
    updateInterval: 2s

heartbeat:
  interval: 10s
  timeout: 15s

telemetry:
  loadMetrics:
    bufferCapacity: 512
  logs:
    bufferCapacity: 512
  hostMetrics:
    bufferCapacity: 512
    pollInterval: 15s
    measureInterval: 250ms

# Client configurations
client:
  rest:
    timeout: 30s
    baseUrl: ""
    followRedirects: true
    keepCookies: true
    idleConnectionTimeout: 10s
    tlsHandshakeTimeout: 10s
    responseHeaderTimeout: 10s
    maxIdleConnections: 100
    maxConnectionsPerHost: 100
    maxIdleConnectionsPerHost: 100
    enableKeepAlive: true
    enableCompression: true
