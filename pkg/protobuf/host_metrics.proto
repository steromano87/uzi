syntax = "proto3";
package message;
option go_package = "github.com/steromano87/harkonnen/v1/pkg/protobuf/message";

message HostMetrics {
  double cpu = 1;
  Memory memory = 2;
  Storage storage = 3;
  Network network = 4;


  message Memory {
    uint64 total = 1;
    uint64 used = 2;
  }

  message Storage {
    uint64 total = 1;
    uint64 used = 2;
  }

  message Network {
    double up_speed = 1;
    double down_speed = 2;
  }
}